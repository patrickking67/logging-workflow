name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm ci && npm run dev
        2. Start a run
        3. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: "OS, Node.js version, browser"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Terminal output, browser console errors, or a screenshot. Remove anything private.
